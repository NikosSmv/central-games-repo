<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple clicker game with timer and high score">
  <title>Clicker Game</title>

  <link rel="stylesheet" href="Clicker.css">
</head>
<body>

  <main class="card">
  <h1>Clicker</h1>

  <p class="score">
    Score: <span id="score">0</span>
  </p>

  <p>
  Time left: <span id="time">15</span>s
  </p>

  <p>
  High Score: <span id="highScore">0</span>
  </p>

  <div class="buttons">
    <button id="clickBtn" class="btn primary">CLICK!</button>
    <button id="resetBtn" class="btn danger">RESET</button>
  </div>
</main>


  <script src="Clicker.js"></script>
</body>
</html>
