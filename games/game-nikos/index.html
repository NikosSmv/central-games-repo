<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <h1>Rock · Paper · Scissors (Nikos Edition)</h1>
<p class="hint">Πρώτος στους 3 πόντους κερδίζει!</p>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Rock · Paper · Scissors</h1>
    <p>Διάλεξε ένα:</p>

    <div class="buttons">
      <button data-choice="rock">✊ Πέτρα</button>
      <button data-choice="paper">✋ Χαρτί</button>
      <button data-choice="scissors">✌️ Ψαλίδι</button>
    </div>
	<div class="score">
  <span>Παίκτης: <b id="pScore">0</b></span>
  <span>Υπολογιστής: <b id="cScore">0</b></span>
</div>

<button id="reset">Reset</button>

    <p id="result"></p>
  </main>

  <script src="game.js"></script>
</body>
</html>
